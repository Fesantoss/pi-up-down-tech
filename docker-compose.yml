
services:
  web:
    image: php:8.2-apache
    container_name: oficina_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    command: >
      bash -c "echo 'ServerName localhost' >> /etc/apache2/apache2.conf &&
      docker-php-ext-install pdo pdo_mysql &&
      apache2-foreground"

  db:
    image: mysql:8.0
    container_name: oficina_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: up-down-tech
    ports:
      - "3307:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: oficina_pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db