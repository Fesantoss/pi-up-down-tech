version: '3.8'

services:
  web:
    build: .
    container_name: updown_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=updown_tech
      - DB_USER=root
      - DB_PASS=secret

  db:
    image: mysql:8.0
    container_name: updown_db
    restart: siempre
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: updown_tech
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d

volumes:
  db_data: